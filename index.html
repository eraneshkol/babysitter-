<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>מעקב שעות מטפלת</title>
<meta name="theme-color" content="#34c759" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="שעות מטפלת" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <h1 id="pageTitle">מעקב שעות</h1>
  </header>

  <main id="view-home" class="view">
    <div id="caregiverSelector" class="caregiver-selector hidden"></div>
    <div class="status-line" id="statusLine">טוען...</div>
    <button id="toggleBtn" class="toggle-btn state-out" disabled>
      <span id="toggleLabel">טוען...</span>
    </button>
    <div class="today-summary" id="todaySummary"></div>
  </main>

  <main id="view-report" class="view hidden">
    <select id="reportCaregiverSelect" class="caregiver-select hidden"></select>
    <div class="month-nav">
      <button id="prevMonthBtn" class="nav-arrow" aria-label="חודש קודם">‹</button>
      <div id="monthLabel" class="month-label">—</div>
      <button id="nextMonthBtn" class="nav-arrow" aria-label="חודש הבא">›</button>
    </div>

    <div class="totals-card">
      <div class="totals-row">
        <span class="totals-key">סה"כ שעות החודש</span>
        <span class="totals-val" id="totalHours">0:00</span>
      </div>
      <div class="totals-row">
        <span class="totals-key">לתשלום</span>
        <span class="totals-val" id="totalPay">₪0</span>
      </div>
    </div>

    <div class="table-wrap">
      <table id="entriesTable">
        <thead>
          <tr><th>תאריך</th><th>כניסה</th><th>יציאה</th><th>שעות</th></tr>
        </thead>
        <tbody id="entriesBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state hidden">אין רישומים בחודש זה</div>
    </div>
  </main>

  <main id="view-settings" class="view hidden">
    <div class="settings-section">
      <div class="section-header">מטפלות</div>
      <div class="settings-card">
        <div id="caregiverList" class="caregiver-list"></div>
        <div class="add-caregiver-form">
          <input type="text" id="newCaregiverName" placeholder="שם המטפלת" />
          <input type="number" id="newCaregiverRate" placeholder="תעריף לשעה (₪)" min="0" step="1" inputmode="decimal" />
          <button id="addCaregiverBtn" class="btn btn-accent">הוספת מטפלת</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-header">גיבוי ושחזור</div>
      <div class="settings-card list-row-group">
        <button id="exportBtn" class="btn-list-row">ייצוא גיבוי</button>
        <label class="btn-list-row file-label">
          ייבוא גיבוי
          <input type="file" id="importInput" accept="application/json" hidden />
        </label>
        <div id="lastBackupInfo" class="last-backup-info"></div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-header">איפוס נתונים</div>
      <div class="settings-card list-row-group">
        <button id="resetBtn" class="btn-list-row danger-text">איפוס כל הנתונים</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span><span>מעקב</span>
    </button>
    <button class="nav-btn" data-view="report">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span>דוח חודשי</span>
    </button>
    <button class="nav-btn" data-view="settings">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span>הגדרות</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast hidden"></div>
<div id="confirmModal" class="modal hidden">
  <div class="modal-box">
    <div id="confirmTitle" class="modal-title"></div>
    <div id="confirmBody" class="modal-body"></div>
    <div class="modal-actions">
      <button id="confirmCancel" class="btn btn-secondary">ביטול</button>
      <button id="confirmOk" class="btn btn-danger">אישור</button>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
